# Include at nginx.conf TOP LEVEL, outside http {}. Requires libnginx-mod-stream.
stream {
    map $ssl_preread_server_name $watchrail_tls_backend {
        default 127.0.0.1:8444;
        include /etc/nginx/watchrail-domains.map;
    }
    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        proxy_timeout 2h;
        proxy_pass $watchrail_tls_backend;
    }
}
